name: animal_scanner
description: A simple animal classifier.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Firebase plugin (Required)
  firebase_core: ^3.1.0
  # AI/ML plugins (Required for scanning)
  tflite_flutter: ^0.12.1
  image_picker: ^1.0.4
  image: ^4.0.17
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  # Graphs and Reports
  fl_chart: ^0.66.0
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2
  # Removed: firebase_data_connect (Not needed for this app and causes errors)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Ensure these files exist in your project folder!
  assets:
    - assets/labels.txt
    - assets/model_unquant.tflite
    - assets/